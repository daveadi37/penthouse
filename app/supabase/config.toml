# Supabase CLI configuration — apartment 3808, Goldcrest Views 1.
#
# This file drives two things: the local stack that `supabase start` runs on
# this machine, and the settings the CLI pushes when the project is linked.
# Every block below is set deliberately. Read the comment before changing one.

# The name the CLI uses for the LOCAL stack's containers. It is not the
# hosted project reference — that is uyasnfutcowdhdpkfhhg, and the CLI
# learns it from `supabase link`, which writes it to supabase/.temp/
# rather than to this file.
project_id = "goldcrest-3808"

# ---------------------------------------------------------------------------
# API
#
# 54321 is the CLI default and the port the local anon key is issued against,
# so it is left alone — changing it means reissuing the key and editing every
# developer's .env. `extensions` is on the search path because the migrations
# install pgcrypto and pg_cron into that schema rather than into public.
# max_rows caps an accidental unbounded select; the largest real read is a
# month of task instances, well inside it.
# ---------------------------------------------------------------------------
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 2000

# ---------------------------------------------------------------------------
# Database
#
# Postgres 15 to match the hosted project. shadow_port is only used while the
# CLI diffs a migration, but it has to be free or `db diff` fails. The pooler
# is off: the app talks to the REST API, not to Postgres directly, so there is
# nothing local for it to pool.
# ---------------------------------------------------------------------------
[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# ---------------------------------------------------------------------------
# Studio
#
# The local dashboard, on 54323. Handy for reading rows while a screen is
# being built; it is not part of the deployed app.
# ---------------------------------------------------------------------------
[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

# ---------------------------------------------------------------------------
# Mail catcher
#
# Sign-in is by magic link, so every local test sends an email. Inbucket
# catches it on 54324 instead of posting it to a real address — which is what
# makes it safe to test the invite flow with the staff's actual addresses.
# ---------------------------------------------------------------------------
[inbucket]
enabled = true
port = 54324

# ---------------------------------------------------------------------------
# Storage
#
# Photographs of the set-up and the clear-up, receipts, warranties and
# manuals. 20MiB is the document ceiling from the deployment notes; camera
# photos are shrunk on the device before they are uploaded, so they land at
# roughly 150KB. Buckets and their policies are created by
# 20260828001600_storage.sql, not here.
# ---------------------------------------------------------------------------
[storage]
enabled = true
file_size_limit = "20MiB"

# ---------------------------------------------------------------------------
# Auth
#
# enable_signup is false in both places on purpose. There are eighteen
# accounts and every one of them is created by an owner from inside the app —
# nobody self-registers, and an open sign-up form on a household database is a
# way in. Adding a person is a deliberate act by somebody holding
# accounts.manage.
#
# site_url is the dev server's port from vite.config.ts. Replace the second
# entry in additional_redirect_urls with the real deployed address.
# ---------------------------------------------------------------------------
[auth]
enabled = true
site_url = "http://localhost:5273"
additional_redirect_urls = [
  "http://localhost:5273",
  "https://REPLACE-WITH-THE-DEPLOYED-ADDRESS",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false

# Email and password. Aditya creates every account and sets every password;
# nobody chooses their own, so there is nothing to reuse from another site and
# nothing to reset back to. Deleting a login ends that person's access
# completely, with no reset email left in an old inbox.
#
# enable_confirmations is false because the account is created by an owner who
# already knows the address is right — there is nobody to confirm anything to,
# and a pending confirmation would just be an account that silently does not
# work. double_confirm_changes stays on: changing an address later should still
# have to be proved.
[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true

# Nobody signs in by phone. Left explicitly off rather than defaulted.
[auth.sms]
enable_signup = false
enable_confirmations = false

# ---------------------------------------------------------------------------
# Analytics
#
# Off. Nothing about this household needs to be measured by a third party.
# ---------------------------------------------------------------------------
[analytics]
enabled = false
